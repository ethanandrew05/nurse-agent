<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Agent - Patient Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="login-wrapper">
        <!-- Illustration Side -->
        <div class="illustration-container">
            <div class="illustration-content">
                <!-- Medical Team Illustration -->
                <img src="{{ url_for('static', filename='images/login_illustration.png') }}" alt="Nurse Agent Team"
                    class="illustration-svg">

            </div>
        </div>

        <!-- Login Form Side -->
        <div class="login-container">
            <div class="login-header">
                <h1 class="login-title">Patient Selection</h1>
                <p class="login-subtitle">Enter patient ID to access records (eg. 1)</p>
            </div>

            {% if error %}
            <div class="error-message">⚠️ {{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="success-message">✅ {{ success }}</div>
            {% endif %}

            <form action="{{ url_for('verify_patient') }}" method="POST" class="login-form">
                <div class="input-group">
                    <label class="input-label" for="patient_id">Patient ID</label>
                    <input type="text" id="patient_id" name="patient_id" required placeholder="Enter your Patient ID"
                        autocomplete="off">
                </div>

                <button type="submit" class="submit-btn" style="width: 100%">Continue</button>
            </form>

            <form action="{{ url_for('create_new_patient') }}" method="POST" style="margin-top: 12px;">
                <button type="submit" class="submit-btn secondary" style="width: 100%">Create New Patient</button>
            </form>
        </div>
    </div>
    </div>
</body>

</html>
